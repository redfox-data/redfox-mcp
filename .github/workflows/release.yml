# RedFox MCP — npm 发布流水线
#
# 触发条件：推送 v* 标签
# 流程：多平台并行编译 PyInstaller 二进制 → 组装 npm 包 → 发布
#
# 所需 GitHub Secrets：
#   NPM_TOKEN — npm publish token
#
# PyPI 发布请使用本地命令：uv build --all-packages && uv publish dist/*

name: Release npm

on:
  push:
    tags: ['v*']

jobs:
  # ─────────────────────────────────────────────
  # 1. 多平台编译 PyInstaller 二进制（并行）
  # ─────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller \
            "redfox-mcp-core>=0.1.3" \
            "redfox-douyin-mcp>=0.2.1" \
            "redfox-xiaohongshu-mcp>=0.2.1" \
            "redfox-wechat-mcp>=0.2.1" \
            "redfox-bilibili-mcp>=0.1.2" \
            "redfox-toutiao-mcp>=0.1.2" \
            "redfox-tiktok-mcp>=0.1.2" \
            "redfox-ai-search-mcp>=0.1.2" \
            "redfox-ai-gen-mcp>=0.1.1" \
            "redfox-twitter-mcp>=0.1.1" \
            "redfox-youtube-mcp>=0.1.1" \
            "redfox-instagram-mcp>=0.1.1" \
            "redfox-kuaishou-mcp>=0.1.1" \
            "redfox-auto-mcp>=0.1.1" \
            "redfox-wechat-channels-mcp>=0.1.1" \
            "redfox-tools-mcp>=0.1.1" \
            "redfox-mcp>=0.4.1"

      - name: Build binaries (4-way parallel)
        run: |
          PLATFORM="${{ matrix.platform }}"
          PY=$(command -v python3 || command -v python)
          ls -d npm/redfox-*-mcp | xargs -P 4 -I {} bash -c '
            pkg=$(basename "{}")
            entry="npm/${pkg}/_entry.py"
            out="npm/${pkg}/bin/'"$PLATFORM"'"
            mkdir -p "$out"
            '"$PY"' -m PyInstaller \
              --onefile --name "$pkg" \
              --distpath "$out" \
              --workpath "/tmp/pyi-${pkg}" \
              --specpath "/tmp" \
              --noconfirm --clean \
              --copy-metadata fastmcp \
              --copy-metadata fastmcp-slim \
              --copy-metadata redfox-python-sdk \
              --copy-metadata redfox-mcp-core \
              --copy-metadata mcp \
              --copy-metadata starlette \
              --copy-metadata httpx \
              --copy-metadata pydantic \
              --copy-metadata pydantic-core \
              --copy-metadata anyio \
              --copy-metadata httpcore \
              "$entry" > /dev/null 2>&1 \
              && echo "  ✓ $pkg" || echo "  ✗ $pkg FAILED"
          '

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: npm/*/bin/${{ matrix.platform }}/
          retention-days: 3

  # ─────────────────────────────────────────────
  # 2. 组装 npm 包并发布
  # ─────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble npm packages
        run: |
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            for platform in darwin-arm64 darwin-x64 linux-x64; do
              src="artifacts/bin-${platform}/${pkg}/bin/${platform}"
              dst="${pkg_dir}/bin/${platform}"
              [[ -d "$src" ]] && mkdir -p "$dst" && cp "$src"/* "$dst/" && chmod +x "$dst"/*
            done
          done
          echo "Assembly done. Package sizes:"
          du -sh npm/redfox-*-mcp/bin/ 2>/dev/null || true

      - name: Publish to npm
        run: |
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            echo "Publishing $pkg ..."
            (cd "$pkg_dir" && npm publish --access public) \
              && echo "  ✓ $pkg" || echo "  ⚠ $pkg skipped"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
