# RedFox MCP — npm 发布流水线（busybox 单二进制模式）
#
# 触发：推送 v* 标签
# 流程：2 平台各编译 1 个 busybox 二进制 → 组装 npm 包 → 发布
#
# 平台：darwin-arm64 (macos-latest)、win32-x64 (windows-latest)
# Secrets: NPM_TOKEN
# PyPI 发布请本地执行：uv build --all-packages && uv publish dist/*

name: Release npm

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          pip install pyinstaller \
            "redfox-mcp-core>=0.1.3" \
            "redfox-douyin-mcp>=0.2.1" \
            "redfox-xiaohongshu-mcp>=0.2.1" \
            "redfox-wechat-mcp>=0.2.1" \
            "redfox-bilibili-mcp>=0.1.2" \
            "redfox-toutiao-mcp>=0.1.2" \
            "redfox-tiktok-mcp>=0.1.2" \
            "redfox-ai-search-mcp>=0.1.2" \
            "redfox-ai-gen-mcp>=0.1.1" \
            "redfox-twitter-mcp>=0.1.1" \
            "redfox-youtube-mcp>=0.1.1" \
            "redfox-instagram-mcp>=0.1.1" \
            "redfox-kuaishou-mcp>=0.1.1" \
            "redfox-auto-mcp>=0.1.1" \
            "redfox-wechat-channels-mcp>=0.1.1" \
            "redfox-tools-mcp>=0.1.1" \
            "redfox-mcp>=0.4.1"

      - name: Build busybox binary
        shell: bash
        run: bash npm/build-binaries.sh --platform ${{ matrix.platform }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: npm/redfox-mcp-bin-${{ matrix.platform }}/bin/
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble npm packages
        run: |
          found=0
          # artifact platform -> npm bin package suffix
          # (win32-x64 ships as redfox-mcp-bin-windows-x64: "win32" in a package
          #  name triggers npm registry spam detection)
          for pair in darwin-arm64:darwin-arm64 win32-x64:windows-x64; do
            platform="${pair%%:*}"
            suffix="${pair##*:}"
            src="artifacts/bin-${platform}"
            dst="npm/redfox-mcp-bin-${suffix}/bin"
            if [[ -d "$src" ]]; then
              mkdir -p "$dst"
              cp "$src"/* "$dst/"
              chmod +x "$dst"/* 2>/dev/null || true
              found=$((found + 1))
              echo "  ✓ $platform: $(du -sh "$dst" | cut -f1)"
            fi
          done
          if [[ $found -eq 0 ]]; then
            echo "Error: no platform binaries available, aborting publish."
            exit 1
          fi

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish binary packages
        run: |
          # npm rate-limits new package creation: retry with backoff.
          publish_retry() {
            local dir="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if (cd "$dir" && npm publish --access public); then return 0; fi
              echo "  attempt $attempt failed, backing off 30s..."
              sleep 30
            done
            return 1
          }
          fail=0
          for pkg_dir in npm/redfox-mcp-bin-*; do
            pkg=$(basename "$pkg_dir")
            if [[ -z "$(ls -A "$pkg_dir/bin" 2>/dev/null)" ]]; then
              echo "::error::no binary in $pkg"
              fail=1
              continue
            fi
            ver=$(node -p "require('./$pkg_dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "  = $pkg@$ver already published, skipping"
              continue
            fi
            echo "Publishing $pkg@$ver ..."
            publish_retry "$pkg_dir" || fail=1
            sleep 10
          done
          exit $fail
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main packages
        run: |
          publish_retry() {
            local dir="$1"
            local attempt
            for attempt in 1 2 3 4; do
              if (cd "$dir" && npm publish --access public); then return 0; fi
              echo "  attempt $attempt failed, backing off 30s..."
              sleep 30
            done
            return 1
          }
          fail=0
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            ver=$(node -p "require('./$pkg_dir/package.json').version")
            if npm view "$pkg@$ver" version >/dev/null 2>&1; then
              echo "  = $pkg@$ver already published, skipping"
              continue
            fi
            echo "Publishing $pkg@$ver ..."
            publish_retry "$pkg_dir" || fail=1
            sleep 10
          done
          exit $fail
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
