# RedFox MCP — npm 发布流水线
#
# 触发：推送 v* 标签
# 流程：3 平台并行编译 → 组装 npm 包 → 发布
#
# Secrets: NPM_TOKEN
# PyPI 发布请本地执行：uv build --all-packages && uv publish dist/*

name: Release npm

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: macos-13
            platform: darwin-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: win32-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller \
            "redfox-mcp-core>=0.1.3" \
            "redfox-douyin-mcp>=0.2.1" \
            "redfox-xiaohongshu-mcp>=0.2.1" \
            "redfox-wechat-mcp>=0.2.1" \
            "redfox-bilibili-mcp>=0.1.2" \
            "redfox-toutiao-mcp>=0.1.2" \
            "redfox-tiktok-mcp>=0.1.2" \
            "redfox-ai-search-mcp>=0.1.2" \
            "redfox-ai-gen-mcp>=0.1.1" \
            "redfox-twitter-mcp>=0.1.1" \
            "redfox-youtube-mcp>=0.1.1" \
            "redfox-instagram-mcp>=0.1.1" \
            "redfox-kuaishou-mcp>=0.1.1" \
            "redfox-auto-mcp>=0.1.1" \
            "redfox-wechat-channels-mcp>=0.1.1" \
            "redfox-tools-mcp>=0.1.1" \
            "redfox-mcp>=0.4.1"

      - name: Build binaries
        run: bash npm/build-binaries.sh --platform ${{ matrix.platform }} --jobs 4

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.platform }}
          path: npm/*/bin/${{ matrix.platform }}/
          retention-days: 3

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble npm packages
        run: |
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            for platform in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
              src="artifacts/bin-${platform}/${pkg}/bin/${platform}"
              dst="${pkg_dir}/bin/${platform}"
              if [[ -d "$src" ]]; then
                mkdir -p "$dst"
                cp "$src"/* "$dst/"
                chmod +x "$dst"/* 2>/dev/null || true
              fi
            done
          done
          echo "=== Assembly complete ==="
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            count=$(find "$pkg_dir/bin" -type f 2>/dev/null | wc -l)
            echo "  $pkg: $count binaries"
          done

      - name: Publish to npm
        run: |
          for pkg_dir in npm/redfox-*-mcp; do
            pkg=$(basename "$pkg_dir")
            echo "Publishing $pkg ..."
            (cd "$pkg_dir" && npm publish --access public) \
              && echo "  ✓ $pkg" || echo "  ⚠ $pkg skipped"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
