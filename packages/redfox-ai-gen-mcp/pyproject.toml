[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-ai-gen-mcp"
version = "0.1.0"
description = "RedFoxHub AI Generation MCP server: GPT image, Doubao Seedream image Pro/Lite, Doubao Seedance video generation with auto polling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "ai-gen", "gpt-image", "seedream", "seedance"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-ai-gen-mcp = "redfox_ai_gen_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_ai_gen_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_ai_gen_mcp", "README.md"]
