[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-ai-search-mcp"
version = "0.1.1"
description = "RedFoxHub AI Search MCP server: Kimi/Doubao/Deepseek/Yuanbao/Qianwen/Baidu web search with auto polling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "ai-search", "kimi", "doubao", "deepseek", "yuanbao", "qianwen", "baidu"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-ai-search-mcp = "redfox_ai_search_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_ai_search_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_ai_search_mcp", "README.md"]
