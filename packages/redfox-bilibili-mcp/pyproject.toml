[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-bilibili-mcp"
version = "0.1.1"
description = "RedFoxHub Bilibili MCP server: video/UP主 search, account info, video list and detail"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "bilibili"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-bilibili-mcp = "redfox_bilibili_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_bilibili_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_bilibili_mcp", "README.md"]
