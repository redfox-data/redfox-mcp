[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-cloud-mcp"
version = "0.1.0"
description = "RedFox cloud MCP: find, describe, call and result over the RedFoxHub catalog with wrapped results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "cloud"]
dependencies = [
    "redfox-mcp-core>=0.1.7",
]

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[project.scripts]
redfox-cloud-mcp = "redfox_cloud_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_cloud_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/redfox_cloud_mcp/catalog.json" = "redfox_cloud_mcp/catalog.json"

[tool.hatch.build.targets.sdist]
include = ["src/redfox_cloud_mcp", "README.md"]
