[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-data-mcp"
version = "0.1.0"
description = "RedFox data MCP: find, describe, call and result over the RedFoxHub catalog"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox"]
dependencies = [
    "redfox-mcp-core>=0.1.7",
]

[project.scripts]
redfox-data-mcp = "redfox_data_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_data_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/redfox_data_mcp/catalog.json" = "redfox_data_mcp/catalog.json"

[tool.hatch.build.targets.sdist]
include = ["src/redfox_data_mcp", "README.md"]
