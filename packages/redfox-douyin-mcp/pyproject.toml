[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-douyin-mcp"
version = "0.2.0"
description = "RedFoxHub Douyin MCP server: Douyin works/user search, account info, works detail, AI works search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "douyin"]
dependencies = [
    "redfox-mcp-core>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-douyin-mcp = "redfox_douyin_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_douyin_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_douyin_mcp", "README.md"]
