[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-kuaishou-mcp"
version = "0.1.0"
description = "RedFoxHub Kuaishou MCP server: work/user search, work detail, user works, transcript"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "kuaishou", "快手"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-kuaishou-mcp = "redfox_kuaishou_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_kuaishou_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_kuaishou_mcp", "README.md"]
