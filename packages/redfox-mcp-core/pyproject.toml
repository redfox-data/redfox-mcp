[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-mcp-core"
version = "0.1.0"
description = "Shared runtime for RedFoxHub MCP servers: client management, multi-tenant auth, async task polling, stdio/HTTP serving"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox"]
dependencies = [
    "fastmcp>=2.0",
    # Intel Mac 上 cryptography 49+ 无预编译 wheel 会触发源码构建，钉住 48.x
    "cryptography<49; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "redfox-python-sdk",
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_mcp_core"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_mcp_core", "README.md"]
