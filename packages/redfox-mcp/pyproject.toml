[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-mcp"
version = "0.3.1"
description = "RedFoxHub MCP server (all-in-one): Douyin/Xiaohongshu/WeChat/Bilibili/Toutiao/TikTok data APIs + AI search, image and video generation tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "douyin", "xiaohongshu", "wechat", "bilibili", "toutiao", "tiktok"]
dependencies = [
    "redfox-douyin-mcp>=0.2.0",
    "redfox-xiaohongshu-mcp>=0.2.0",
    "redfox-wechat-mcp>=0.2.0",
    "redfox-bilibili-mcp>=0.1.0",
    "redfox-toutiao-mcp>=0.1.0",
    "redfox-tiktok-mcp>=0.1.0",
    "redfox-ai-search-mcp>=0.1.0",
    "redfox-ai-gen-mcp>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-mcp = "redfox_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }
redfox-douyin-mcp = { workspace = true }
redfox-xiaohongshu-mcp = { workspace = true }
redfox-wechat-mcp = { workspace = true }
redfox-bilibili-mcp = { workspace = true }
redfox-toutiao-mcp = { workspace = true }
redfox-tiktok-mcp = { workspace = true }
redfox-ai-search-mcp = { workspace = true }
redfox-ai-gen-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_mcp", "README.md"]
