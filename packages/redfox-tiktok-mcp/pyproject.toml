[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-tiktok-mcp"
version = "0.1.1"
description = "RedFoxHub TikTok MCP server: account search, video search, work detail and user works"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "tiktok"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-tiktok-mcp = "redfox_tiktok_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_tiktok_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_tiktok_mcp", "README.md"]
