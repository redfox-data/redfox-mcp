[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-twitter-mcp"
version = "0.1.0"
description = "RedFoxHub X(Twitter) MCP server: tweet search/detail, user info, comments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "twitter", "x"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-twitter-mcp = "redfox_twitter_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_twitter_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_twitter_mcp", "README.md"]
