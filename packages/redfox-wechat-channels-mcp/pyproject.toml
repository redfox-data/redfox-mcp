[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-wechat-channels-mcp"
version = "0.1.0"
description = "RedFoxHub WeChat Channels (视频号) MCP server: work/user search, work detail, transcript"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "wechat-channels", "视频号"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-wechat-channels-mcp = "redfox_wechat_channels_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_wechat_channels_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_wechat_channels_mcp", "README.md"]
