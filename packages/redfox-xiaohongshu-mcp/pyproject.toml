[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-xiaohongshu-mcp"
version = "0.2.0"
description = "RedFoxHub Xiaohongshu MCP server: note/blogger search, account info, note detail, AI notes search"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "xiaohongshu", "rednote"]
dependencies = [
    "redfox-mcp-core>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-xiaohongshu-mcp = "redfox_xiaohongshu_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_xiaohongshu_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_xiaohongshu_mcp", "README.md"]
