[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redfox-youtube-mcp"
version = "0.1.0"
description = "RedFoxHub YouTube MCP server: video search/detail, comments, transcript"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["mcp", "redfox", "youtube"]
dependencies = [
    "redfox-mcp-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/redfox-data/redfox-mcp"
Website = "https://redfox.hk/apis/?source=mcp"

[project.scripts]
redfox-youtube-mcp = "redfox_youtube_mcp.server:main"

[tool.uv.sources]
redfox-mcp-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/redfox_youtube_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/redfox_youtube_mcp", "README.md"]
